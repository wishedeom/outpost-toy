<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OUTPOST — toy shooter</title><style>*{box-sizing:border-box}body{margin:0;background:#080d13;color:#dee6ec;font:16px monospace;height:100vh;display:flex;flex-direction:column}header,footer{padding:14px 24px;display:flex;justify-content:space-between;gap:20px}header{border-bottom:1px solid #33414c}b{color:#ffb449}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;min-height:0;flex:1;background:#101820}button{background:#ffb449;border:0;padding:8px 18px;font:inherit;cursor:pointer}footer{align-items:center;flex-wrap:wrap}#status{color:#ffb449}body{height:100dvh}.touch{display:none;justify-content:space-between;padding:8px 12px;gap:12px}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.touch button{min-height:48px;padding:5px;touch-action:none;user-select:none;background:#314756;color:white;border-radius:8px}.touch button.held{background:#aa7029}.touch .fire{grid-column:1/4;background:#ffb449;color:#111}@media(pointer:coarse){.touch{display:flex}header,footer{padding:8px;font-size:14px;flex-wrap:wrap}footer>span:first-child{display:none}}@media(pointer:coarse) and (orientation:landscape){.touch{position:absolute;bottom:48px;left:0;right:0;pointer-events:none}.pad{pointer-events:auto;opacity:.85}}</style><header><strong>OUTPOST <b>/</b> SECTOR 01</strong><span id="hud"></span></header><canvas width="640" height="360" aria-label="First person shooter game"></canvas><nav class="touch" aria-label="Touch controls"><div class="pad"><button data-key="KeyA" aria-label="Strafe left">◀</button><button data-key="KeyW" aria-label="Forward">▲</button><button data-key="KeyD" aria-label="Strafe right">▶</button><button data-key="KeyS" style="grid-column:2" aria-label="Backward">▼</button></div><div class="pad"><button data-key="ArrowLeft" aria-label="Turn left">↶</button><button data-key="ArrowRight" style="grid-column:3" aria-label="Turn right">↷</button><button class="fire" data-key="Space">FIRE</button></div></nav><footer><span>WASD move · ← → turn · Space / click fire · R restart</span><button id="start">ENTER OUTPOST</button><span id="status">Reach the green EXIT at the far east wall.</span></footer><script src="game.js"></script></html>
